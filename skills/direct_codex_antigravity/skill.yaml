  rationale: 'The skill as published on 2026-11-08 prescribes --dangerously-bypass-approvals-and-sandbox only as a narrow retry after a sandbox failure, with --skip-git-repo-check and closed stdin on the first call. After publication, three Codex builds on 2026-11-09 repeated the same shape: funding burned 29089 tokens on a zero-output sandbox failure then succeeded on a 22093-token bypass retry, stocks burned 21313 then succeeded on 16415, and the stocks rebuild burned 14185 then succeeded on 10326. Bubblewrap is missing on this machine, so the sandboxed first call predictably fails and the retry-only rule guarantees one wasted call per build while Codex quota is scarce. The update adds a bubblewrap preflight check and moves the approved bypass to the first call only when bubblewrap is missing, keeping the approval gate, the tight brief, and Antigravity review. No other proposal is made: the YouTube transcript batches and the J Law catalog work are still in progress with Batch 4 and the Gemini Pullback Buy extraction pending, and the handoff-suppression hypotheses are policy-level and out of scope for managed documents.'
